    body.panel-open .kg-drawer { transform: translateY(0); border-left: none; border-top: 1px solid var(--line-2); }
    .legend { display: none; }

  { id:'G2', label:'工作流自动化', module:'G', bloom:6, weeks:'W14', resource:'课件W14·工作流章节', tags:['diff','exam'],
    desc:'传媒工作全流程AI化设计、多工具串联、效率优化方法' },
  { id:'G3', label:'AI伦理规范', module:'G', bloom:5, weeks:'W14, W16', resource:'课件W14+W16', tags:['key','exam','sz'],
    desc:'AI使用的伦理原则（公平/透明/可问责）、新闻伦理与AI合规要求' },
  { id:'G4', label:'学术诚信', module:'G', bloom:5, weeks:'W10, W16', resource:'课件W10、W16', tags:['key','exam','sz'],
    desc:'AI辅助创作的标注规范、原创性边界、版权法对AI内容的界定' }
];

const knowledgeEdges = [
  { from:'B1', to:'B3', label:'演进', type:'evolution' },
  { from:'B2', to:'B3', label:'分类', type:'taxonomy' },
  { from:'B3', to:'B4', label:'技术基础', type:'foundation' },
  { from:'B4', to:'B5', label:'架构基础', type:'foundation' },
  { from:'C1', to:'C2', label:'包含', type:'composition' },
  { from:'C2', to:'C3', label:'协同', type:'synergy' },
  { from:'C1', to:'C4', label:'约束层', type:'constraint' },
  { from:'D1', to:'D2', label:'深化', type:'deepening' },
  { from:'D2', to:'D3', label:'质量保障', type:'quality' },
  { from:'D2', to:'D4', label:'信息基础', type:'foundation' },
  { from:'E1', to:'E2', label:'反向', type:'reverse' },
  { from:'E3', to:'E4', label:'产出', type:'output' },
  { from:'E1', to:'E3', label:'信息处理基础', type:'foundation' },
  { from:'F1', to:'F2', label:'互补', type:'synergy' },
  { from:'F1', to:'F3', label:'高级策略', type:'advanced' },
  { from:'F3', to:'F4', label:'工具选择', type:'selection' },
  { from:'G1', to:'G2', label:'深化', type:'deepening' },
  { from:'G3', to:'G2', label:'约束', type:'constraint' },
  { from:'G3', to:'G4', label:'合规底线', type:'compliance' },
  { from:'B5', to:'C1', label:'技术→应用', type:'cross' },
  { from:'C1', to:'D1', label:'核心技能', type:'cross' },
  { from:'D3', to:'E1', label:'信息处理', type:'cross' },
  { from:'E4', to:'G4', label:'伦理约束', type:'cross' },
  { from:'F3', to:'E4', label:'能力增强', type:'cross' }
];

function weekIds(weeks) {
  return Array.from(String(weeks).matchAll(/W(\d+)/g), function (m) {
    return m[1].padStart(2, '0');
  }).filter(function (id, i, arr) { return arr.indexOf(id) === i; });
}

function weekHref(id) {
  return '../weeks/week-' + id + '.html';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (ch) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch];
  });
}

function buildNodeSize(node) {
  var size = 20;
  if (node.tags.indexOf('key') >= 0) size += 4;
  if (node.tags.indexOf('diff') >= 0) size += 2;
  if (node.bloom >= 5) size += 3;
  return size;
}

function clusterAnchors() {
  var anchors = {};
  var radius = 360;
  MODULE_ORDER.forEach(function (mod, i) {
    var ang = -Math.PI / 2 + i * (Math.PI * 2 / 6);
    anchors[mod] = { x: Math.cos(ang) * radius, y: Math.sin(ang) * radius };
  });
  return anchors;
}

const ANCHORS = clusterAnchors();

if (typeof vis === 'undefined') {
  document.getElementById('graph-container').innerHTML =
    '<p style="padding:48px;text-align:center;color:#6E5B41">图谱脚本未能加载，请刷新或检查网络。</p>';
  throw new Error('vis-network missing');
}

const visNodes = new vis.DataSet([]);
const visEdges = new vis.DataSet([]);

MODULE_ORDER.forEach(function (mod) {
  var mc = MODULE_COLORS[mod];
  var a = ANCHORS[mod];
  visNodes.add({
    id: 'hub-' + mod,
    label: mod,
    title: mc.name + ' · ' + mc.weeks,
    group: mod,
    x: a.x, y: a.y,
    _x0: a.x, _y0: a.y,
    fixed: true,
    size: 22,
    shape: 'hexagon',
    font: { color: '#F7EFDA', size: 16, face: 'Noto Serif SC, Kaiti SC, KaiTi, serif', vadjust: 0 },
    color: { background: mc.bg, border: mc.border, highlight: { background: mc.highlight, border: '#F7EFDA' }, hover: { background: mc.highlight, border: '#F7EFDA' } },
    borderWidth: 2,
    mass: 4,
    _hub: true,
    _module: mod
  });
});

knowledgeNodes.forEach(function (n, idxInAll) {
  var mc = MODULE_COLORS[n.module];
  var siblings = knowledgeNodes.filter(function (x) { return x.module === n.module; });
  var j = siblings.indexOf(n);
  var ang = (j / siblings.length) * Math.PI * 2 - Math.PI / 2;
  var r = 148;
  var a = ANCHORS[n.module];
  visNodes.add({
    id: n.id,
    label: n.id + '\n' + n.label,
    title: n.label + ' · ' + n.weeks,
    group: n.module,
    x: a.x + Math.cos(ang) * r,
    y: a.y + Math.sin(ang) * r,
    _x0: a.x + Math.cos(ang) * r,
    _y0: a.y + Math.sin(ang) * r,
    fixed: true,
    size: buildNodeSize(n),
    shape: 'dot',
    font: { color: '#3A2E20', size: 13, face: 'Noto Serif SC, Kaiti SC, KaiTi, serif', multi: true, vadjust: 2 },
    color: {
      background: mc.bg,
      border: mc.border,
      highlight: { background: mc.highlight, border: '#F7EFDA' },
      hover: { background: mc.highlight, border: '#F7EFDA' }
    },
    borderWidth: 2,
    borderWidthSelected: 3,
    mass: 1,
    _hub: false,
    _module: n.module
  });
  visEdges.add({
    id: 'spoke-' + n.id,
    from: 'hub-' + n.module,
    to: n.id,
    arrows: { to: { enabled: false } },
    color: { color: mc.bg, opacity: 0.22 },
    width: 1,
    dashes: [3, 5],
    smooth: false,
    _spoke: true
  });
});

knowledgeEdges.forEach(function (e, i) {
  var isCross = e.type === 'cross';
  visEdges.add({
    id: 'e-' + i,
    from: e.from,
    to: e.to,
    label: e.label,
    arrows: { to: { enabled: true, scaleFactor: 0.55 } },
    color: { color: isCross ? '#A2402F' : '#C7B189', highlight: '#33567C', hover: '#33567C', opacity: isCross ? 0.55 : 0.7 },
    dashes: isCross ? [7, 5] : false,
    width: isCross ? 1.4 : 1.6,
    font: { color: '#6E5B41', size: 11, strokeWidth: 4, strokeColor: '#F0E6CF', face: 'Noto Serif SC, KaiTi, serif' },
    smooth: { type: 'curvedCW', roundness: 0.18 },
    _spoke: false
  });
});

const container = document.getElementById('graph-container');
const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
  physics: { enabled: false },
  interaction: { hover: true, tooltipDelay: 160, zoomView: true, dragView: true, dragNodes: true, navigationButtons: false },
  layout: { improvedLayout: false, randomSeed: 7 },
  nodes: { chosen: true, fixed: false },
  edges: { selectionWidth: 2 }
});

const TAG_NAMES = { key: '重点', diff: '难点', exam: '考点', sz: '思政' };
const TAG_CLASSES = { key: 'tag-key-detail', diff: 'tag-diff-detail', exam: 'tag-exam-detail', sz: 'tag-sz-detail' };

function openPanel() { document.body.classList.add('panel-open'); resizeGraph(); }
function closePanel() {
  document.body.classList.remove('panel-open');
  document.getElementById('panelPlaceholder').hidden = false;
  document.getElementById('nodeDetail').hidden = true;
  document.getElementById('nodeDetail').innerHTML = '';
  network.unselectAll();
  resizeGraph();
}

function resizeGraph() {
  requestAnimationFrame(function () {
    network.redraw();
    network.setSize(container.clientWidth + 'px', container.clientHeight + 'px');
  });
}

function relatedOf(nodeId) {
  return knowledgeEdges.filter(function (e) {
    return e.from === nodeId || e.to === nodeId;
  }).map(function (e) {
    var targetId = e.from === nodeId ? e.to : e.from;
    var targetNode = knowledgeNodes.find(function (n) { return n.id === targetId; });
    return {
      id: targetId,
      name: targetNode ? targetNode.label : targetId,
      label: e.label,
      direction: e.from === nodeId ? '→' : '←',
      type: e.type
    };
  });
}

function weekButtons(weeks) {
  return weekIds(weeks).map(function (id) {
    return '<a class="week-link" href="' + weekHref(id) + '">打开第 ' + parseInt(id, 10) + ' 周课文 →</a>';
  }).join('');
}

function showNodeDetail(nodeId) {
  var node = knowledgeNodes.find(function (n) { return n.id === nodeId; });
  if (!node) return;
  var mc = MODULE_COLORS[node.module];
  var related = relatedOf(nodeId);
  document.getElementById('panelPlaceholder').hidden = true;
  var detail = document.getElementById('nodeDetail');
  detail.hidden = false;
  detail.innerHTML =
    '<button type="button" class="drawer-close" id="drawerClose" aria-label="关闭">×</button>' +
    '<div class="node-id" style="background:' + mc.bg + '22;color:' + mc.bg + '">' + escapeHtml(node.id) + '</div>' +
    '<div class="node-name">' + escapeHtml(node.label) + '</div>' +
    '<div class="node-module-label">' + escapeHtml(mc.name) + ' · ' + escapeHtml(mc.weeks) + '</div>' +
    '<div class="node-desc">' + escapeHtml(node.desc) + '</div>' +
    '<div class="meta-grid"><div class="meta-item"><div class="meta-label">Bloom 层级</div><div class="meta-value">' + BLOOM_LABELS[node.bloom] + '</div></div>' +
    '<div class="meta-item"><div class="meta-label">教学周次</div><div class="meta-value">' + escapeHtml(node.weeks) + '</div></div></div>' +
    (node.tags.length ? '<div class="tags-title">教学标签</div><div class="tags-list">' +
      node.tags.map(function (t) { return '<span class="tag ' + TAG_CLASSES[t] + '">' + TAG_NAMES[t] + '</span>'; }).join('') +
      '</div>' : '') +
    (related.length ? '<div class="tags-title">关联知识点（' + related.length + '）</div>' +
      related.map(function (r) {
        return '<div class="relation-item" data-goto="' + escapeHtml(r.id) + '"><span class="relation-arrow">' + r.direction + '</span><div><div class="relation-name">' + escapeHtml(r.id + ' ' + r.name) + '</div><div class="relation-label">' + escapeHtml(r.label) + (r.type === 'cross' ? ' · 跨模块' : '') + '</div></div></div>';
      }).join('') : '') +
    '<div class="tags-title">课文入口</div>' + weekButtons(node.weeks) +
    '<div class="resource-link" aria-hidden="true">' + escapeHtml(node.resource) + '</div>';
  document.getElementById('drawerClose').onclick = closePanel;
  detail.querySelectorAll('[data-goto]').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-goto');
      network.selectNodes([id]);
      showNodeDetail(id);
      emphasize(id);
      network.focus(id, { scale: 1.25, animation: { duration: 420, easingFunction: 'easeInOutQuad' } });
    });
  });
  openPanel();
}

function showModuleDetail(mod) {
  var mc = MODULE_COLORS[mod];
  var kids = knowledgeNodes.filter(function (n) { return n.module === mod; });
  document.getElementById('panelPlaceholder').hidden = true;
  var detail = document.getElementById('nodeDetail');
  detail.hidden = false;
  detail.innerHTML =
    '<button type="button" class="drawer-close" id="drawerClose" aria-label="关闭">×</button>' +
    '<div class="node-id" style="background:' + mc.bg + '22;color:' + mc.bg + '">' + mod + '</div>' +
    '<div class="node-name">' + escapeHtml(mc.name) + '</div>' +
    '<div class="node-module-label">' + escapeHtml(mc.weeks) + ' · ' + kids.length + ' 个知识点</div>' +
    '<div class="node-desc">本簇按教学周聚集。点下方条目进入具体知识点，或继续在图上点选。</div>' +
    kids.map(function (n) {
      return '<div class="relation-item" data-goto="' + n.id + '"><span class="relation-arrow">→</span><div><div class="relation-name">' + escapeHtml(n.id + ' ' + n.label) + '</div><div class="relation-label">' + escapeHtml(n.weeks) + '</div></div></div>';
    }).join('');
  document.getElementById('drawerClose').onclick = closePanel;
  detail.querySelectorAll('[data-goto]').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-goto');
      network.selectNodes([id]);
      showNodeDetail(id);
      emphasize(id);
      network.focus(id, { scale: 1.25, animation: { duration: 420, easingFunction: 'easeInOutQuad' } });
    });
  });
  openPanel();
}

function connectedSet(id) {
  var set = {};
  set[id] = true;
  if (String(id).indexOf('hub-') === 0) {
    var mod = id.slice(4);
    set[id] = true;
    knowledgeNodes.forEach(function (n) { if (n.module === mod) set[n.id] = true; });
    return set;
  }
  var node = knowledgeNodes.find(function (n) { return n.id === id; });
  if (node) set['hub-' + node.module] = true;
  knowledgeEdges.forEach(function (e) {
    if (e.from === id) set[e.to] = true;
    if (e.to === id) set[e.from] = true;
  });
  return set;
}

function emphasize(id) {
  var keep = connectedSet(id);
  visNodes.forEach(function (n) {
    visNodes.update({ id: n.id, opacity: keep[n.id] ? 1 : 0.16 });
  });
  visEdges.forEach(function (e) {
    var on = keep[e.from] && keep[e.to];
    visEdges.update({ id: e.id, hidden: !on && e._spoke ? true : false, color: Object.assign({}, e.color, { opacity: on ? (e._spoke ? 0.35 : 0.85) : 0.08 }) });
  });
}

function clearEmphasis() {
  visNodes.forEach(function (n) { visNodes.update({ id: n.id, opacity: 1 }); });
  visEdges.forEach(function (e) {
    visEdges.update({
      id: e.id,
      hidden: false,
      color: Object.assign({}, e.color, { opacity: e._spoke ? 0.22 : (String(e.id).indexOf('e-') === 0 && knowledgeEdges[parseInt(e.id.slice(2), 10)] && knowledgeEdges[parseInt(e.id.slice(2), 10)].type === 'cross' ? 0.55 : 0.7) })
    });
  });
}

function nodeVisible(n) {
  var activeMod = document.querySelector('.filter-btn.active').dataset.module;
  var activeTags = Array.from(document.querySelectorAll('.tag-btn.active')).map(function (b) { return b.dataset.tag; });
  var q = document.getElementById('kgSearch').value.trim().toLowerCase();
  var modMatch = activeMod === 'all' || n.module === activeMod;
  var tagMatch = activeTags.length === 0 || n.tags.some(function (t) { return activeTags.indexOf(t) >= 0; });
  var text = (n.id + ' ' + n.label + ' ' + n.desc + ' ' + n.weeks).toLowerCase();
  var qMatch = !q || text.indexOf(q) >= 0;
  return modMatch && tagMatch && qMatch;
}

function applyFilters() {
  var activeMod = document.querySelector('.filter-btn.active').dataset.module;
  var visible = [];
  knowledgeNodes.forEach(function (n) {
    var show = nodeVisible(n);
    visNodes.update({ id: n.id, hidden: !show, opacity: 1 });
    visEdges.update({ id: 'spoke-' + n.id, hidden: !show });
    if (show) visible.push(n);
  });
  MODULE_ORDER.forEach(function (mod) {
    var showHub = activeMod === 'all' || activeMod === mod;
    if (showHub) showHub = knowledgeNodes.some(function (n) { return n.module === mod && nodeVisible(n); });
    visNodes.update({ id: 'hub-' + mod, hidden: !showHub, opacity: 1 });
  });
  document.getElementById('statNodes').textContent = visible.length;
  document.getElementById('statKey').textContent = visible.filter(function (n) { return n.tags.indexOf('key') >= 0; }).length;
  document.getElementById('statDiff').textContent = visible.filter(function (n) { return n.tags.indexOf('diff') >= 0; }).length;
  document.getElementById('statExam').textContent = visible.filter(function (n) { return n.tags.indexOf('exam') >= 0; }).length;
  document.getElementById('statSz').textContent = visible.filter(function (n) { return n.tags.indexOf('sz') >= 0; }).length;
}

function resetView() {
  document.getElementById('kgSearch').value = '';
  document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.module === 'all'); });
  document.querySelectorAll('.tag-btn').forEach(function (b) { b.classList.add('active'); });
  closePanel();
  applyFilters();
  clearEmphasis();
  visNodes.getIds().forEach(function (id) {
    var n = visNodes.get(id);
    if (n && n._x0 != null) network.moveNode(id, n._x0, n._y0);
  });
  network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
}

document.querySelectorAll('.filter-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    applyFilters();
    clearEmphasis();
  });
});
document.querySelectorAll('.tag-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    btn.classList.toggle('active');
    applyFilters();
  });
});
document.getElementById('kgReset').addEventListener('click', resetView);
document.getElementById('kgSearch').addEventListener('input', applyFilters);
document.getElementById('kgSearch').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var hit = knowledgeNodes.find(nodeVisible);
  if (!hit) return;
  network.selectNodes([hit.id]);
  showNodeDetail(hit.id);
  emphasize(hit.id);
  network.focus(hit.id, { scale: 1.3, animation: { duration: 480, easingFunction: 'easeInOutQuad' } });
});

network.on('click', function (params) {
  if (params.nodes.length) {
    var id = params.nodes[0];
    if (String(id).indexOf('hub-') === 0) {
      showModuleDetail(id.slice(4));
      emphasize(id);
    } else {
      showNodeDetail(id);
      emphasize(id);
    }
    return;
  }
  closePanel();
  clearEmphasis();
});

network.on('doubleClick', function (params) {
  if (params.nodes.length) {
    network.focus(params.nodes[0], { scale: 1.45, animation: { duration: 520, easingFunction: 'easeInOutQuad' } });
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    closePanel();
    clearEmphasis();
  }
  if (e.key === '/' && document.activeElement !== document.getElementById('kgSearch')) {
    e.preventDefault();
    document.getElementById('kgSearch').focus();
  }
});

network.setOptions({ physics: { enabled: true, stabilization: { iterations: 1 } } });
network.stabilize(8);
network.setOptions({ physics: { enabled: false } });
visNodes.update(visNodes.getIds().map(function (id) { return { id: id, fixed: false }; }));
setTimeout(function () {
  network.fit({ animation: false, padding: 40 });
}, 40);

window.addEventListener('resize', resizeGraph);
document.getElementById('statEdges').textContent = String(knowledgeEdges.length);
applyFilters();
</script>
</body>
</html>
